server {
    listen 80;
    server_name localhost;
    client_max_body_size 64M;

    root /usr/share/nginx/html;
    index index.html;

    # Support Single Page App Routing (fallback to index.html if needed, 
    # but here we use distinct html files)
    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse Proxy for API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy for Backend Static Assets (Uploads)
    location /static/uploads/ {
        proxy_pass http://backend:5000/static/uploads/;
        proxy_set_header Host $host;
    }

    # Reverse Proxy for Backend Static Assets (QR Codes)
    location /static/qrcodes/ {
        proxy_pass http://backend:5000/static/qrcodes/;
        proxy_set_header Host $host;
    }

    # Frontend Static Assets (JS/CSS) will fall through to root /usr/share/nginx/html
}
