<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="flex items-center space-x-4" id="nav-links">
                    <!-- Links injected by main.js -->
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4 gradient-text">周边商城</h1>
            <p class="text-gray-400">将您的记忆带入现实世界</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Product 1 -->
            <div class="glass rounded-2xl overflow-hidden product-card">
                <div class="h-48 bg-gray-800 flex items-center justify-center">
                    <svg class="w-20 h-20 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-2">实体二维码贴纸</h3>
                    <p class="text-gray-400 text-sm mb-4">高精度防水贴纸，适合贴在日记本、礼品盒或明信片上。一套 12 枚。</p>
                    <div class="flex justify-between items-center">
                        <span class="text-cyber-neon font-bold text-lg">¥ 29.90</span>
                        <button class="bg-cyber-light/20 text-cyber-light px-4 py-2 rounded-lg hover:bg-cyber-light/30 transition">详情</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="glass rounded-2xl overflow-hidden product-card">
                <div class="h-48 bg-gray-800 flex items-center justify-center">
                    <svg class="w-20 h-20 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-2">金属蚀刻铭牌</h3>
                    <p class="text-gray-400 text-sm mb-4">不锈钢或黄铜材质，激光蚀刻永久保存。适合宠物吊牌、钥匙扣。</p>
                    <div class="flex justify-between items-center">
                        <span class="text-cyber-neon font-bold text-lg">¥ 68.00</span>
                        <button class="bg-cyber-light/20 text-cyber-light px-4 py-2 rounded-lg hover:bg-cyber-light/30 transition">详情</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="glass rounded-2xl overflow-hidden product-card">
                <div class="h-48 bg-gray-800 flex items-center justify-center">
                    <svg class="w-20 h-20 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-2">拍立得相框套装</h3>
                    <p class="text-gray-400 text-sm mb-4">包含复古相框与定制二维码贴纸，让您的照片“会说话”。</p>
                    <div class="flex justify-between items-center">
                        <span class="text-cyber-neon font-bold text-lg">¥ 45.00</span>
                        <button class="bg-cyber-light/20 text-cyber-light px-4 py-2 rounded-lg hover:bg-cyber-light/30 transition">详情</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-16 p-8 glass rounded-2xl text-center">
            <h2 class="text-2xl font-bold mb-4">定制服务</h2>
            <p class="text-gray-400 mb-6">需要大批量定制或特殊材质？联系我们的设计师团队。</p>
            <button class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105">
                联系我们
            </button>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
</body>
</html>
