<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光胶囊 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
        .capsule-card { transition: all 0.3s ease; }
        .capsule-card:hover { transform: translateY(-5px); }
        .capsule-card.unlocked:hover { border-color: #38bdf8; box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.3); }
        .capsule-card.locked:hover { border-color: #f472b6; box-shadow: 0 10px 30px -10px rgba(244, 114, 182, 0.3); }
        .countdown-digit {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(244, 114, 182, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 50px;
            text-align: center;
        }
        .locked-overlay {
            background: radial-gradient(circle, rgba(244, 114, 182, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="flex items-center space-x-4" id="nav-links">
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold mb-4 gradient-text">时光胶囊</h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto">
                穿越时空的讯息，在未来的某个时刻与曾经的自己重逢。
            </p>
            <a href="/create.html" class="inline-block mt-6 bg-cyber-neon text-white font-bold py-3 px-8 rounded-full hover:bg-pink-600 transition shadow-lg shadow-cyber-neon/20">
                + 创建时光胶囊
            </a>
        </div>

        <div class="flex gap-2 mb-8 justify-center flex-wrap">
            <button onclick="filterCapsules('all')" class="capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-cyber-light text-cyber-dark" data-filter="all">全部</button>
            <button onclick="filterCapsules('locked')" class="capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-filter="locked">锁定中</button>
            <button onclick="filterCapsules('unlocked')" class="capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-filter="unlocked">已解锁</button>
            <button onclick="filterCapsules('mine')" class="capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-filter="mine">我的</button>
        </div>

        <div id="capsules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500 col-span-full text-center py-20">加载中...</p>
        </div>
    </main>

    <footer class="glass mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
            <p>&copy; 2026 Memory QR. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        let currentFilter = 'all';
        let allCapsules = [];

        function getCountdown(targetTimeStr) {
            const target = new Date(targetTimeStr.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diff = target - now;

            if (diff <= 0) {
                return { unlocked: true, text: '已解锁' };
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            return {
                unlocked: false,
                days, hours, minutes, seconds,
                text: `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`
            };
        }

        function renderCountdowns() {
            document.querySelectorAll('[data-countdown]').forEach(el => {
                const timeStr = el.dataset.countdown;
                const cd = getCountdown(timeStr);
                if (cd.unlocked) {
                    el.innerHTML = `
                        <div class="text-green-400 font-bold text-lg flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                            已解锁
                        </div>
                    `;
                } else {
                    el.innerHTML = `
                        <div class="flex items-center gap-2 text-sm">
                            <div class="countdown-digit">
                                <div class="text-xl font-bold text-cyber-light">${cd.days}</div>
                                <div class="text-xs text-gray-500">天</div>
                            </div>
                            <div class="countdown-digit">
                                <div class="text-xl font-bold text-cyber-light">${cd.hours}</div>
                                <div class="text-xs text-gray-500">时</div>
                            </div>
                            <div class="countdown-digit">
                                <div class="text-xl font-bold text-cyber-neon">${cd.minutes}</div>
                                <div class="text-xs text-gray-500">分</div>
                            </div>
                            <div class="countdown-digit">
                                <div class="text-xl font-bold text-cyber-neon">${cd.seconds}</div>
                                <div class="text-xs text-gray-500">秒</div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function filterCapsules(filter) {
            currentFilter = filter;
            document.querySelectorAll('.capsule-filter').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-cyber-light text-cyber-dark';
                } else {
                    btn.className = 'capsule-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700';
                }
            });
            renderCapsules();
        }

        function getVisibilityBadge(visibility) {
            if (visibility === 'public') {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-blue-500/20 text-blue-400 border border-blue-500/30">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    公开
                </span>`;
            }
            return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-gray-500/20 text-gray-400 border border-gray-500/30">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                私有
            </span>`;
        }

        function renderCapsules() {
            const grid = document.getElementById('capsules-grid');
            grid.innerHTML = '';

            let capsules = allCapsules;

            if (currentFilter === 'locked') {
                capsules = capsules.filter(c => c.is_locked);
            } else if (currentFilter === 'unlocked') {
                capsules = capsules.filter(c => !c.is_locked);
            } else if (currentFilter === 'mine') {
                capsules = capsules.filter(c => c.can_view && c.author_id);
            }

            if (capsules.length === 0) {
                let emptyText = '暂无时光胶囊';
                if (currentFilter === 'locked') emptyText = '没有锁定中的时光胶囊';
                else if (currentFilter === 'unlocked') emptyText = '没有已解锁的时光胶囊';
                else if (currentFilter === 'mine') emptyText = '你还没有创建时光胶囊';

                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-500">
                        <p class="text-xl mb-4">${emptyText}</p>
                        <a href="/create.html" class="text-cyber-light hover:underline">去创建一个 &rarr;</a>
                    </div>
                `;
                return;
            }

            capsules.forEach(c => {
                const cd = getCountdown(c.unlock_time);
                const locked = c.is_locked;

                const card = document.createElement('div');
                card.className = `capsule-card glass rounded-2xl overflow-hidden cursor-pointer ${locked ? 'locked border-pink-500/30' : 'unlocked border-blue-500/30'}`;
                card.onclick = () => window.location.href = c.view_url;

                let previewContent = '';
                if (locked) {
                    previewContent = `
                        <div class="locked-overlay aspect-square flex flex-col items-center justify-center p-8 text-center">
                            <div class="w-20 h-20 bg-cyber-neon/20 rounded-full flex items-center justify-center mb-6 border border-cyber-neon/30">
                                <svg class="w-10 h-10 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                            <p class="text-gray-300 text-sm mb-2">这颗胶囊还在沉睡中...</p>
                            <p class="text-xs text-gray-500">距离解锁还有</p>
                            <div class="mt-3" data-countdown="${c.unlock_time}"></div>
                        </div>
                    `;
                } else if (c.media_url) {
                    if (c.media_type === 'image') {
                        previewContent = `<div class="aspect-square bg-gray-800 flex items-center justify-center p-2"><img src="${c.media_url}" alt="" class="max-h-full max-w-full rounded-lg object-cover"></div>`;
                    } else {
                        previewContent = `
                            <div class="aspect-square bg-gray-800 flex flex-col items-center justify-center p-8">
                                <svg class="w-16 h-16 text-cyber-light mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span class="text-gray-400 text-sm">视频记忆</span>
                            </div>
                        `;
                    }
                } else if (c.qr_url) {
                    previewContent = `<div class="aspect-square bg-gray-800 flex items-center justify-center p-6"><img src="${c.qr_url}" alt="QR" class="max-h-full max-w-full rounded-lg shadow-lg"></div>`;
                } else {
                    previewContent = `
                        <div class="aspect-square bg-gray-800 flex flex-col items-center justify-center p-8">
                            <svg class="w-16 h-16 text-green-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                            <span class="text-gray-400 text-sm">文字记忆</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${previewContent}
                    <div class="p-5">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h3 class="text-lg font-bold truncate flex-1">${c.title}</h3>
                            ${getVisibilityBadge(c.visibility)}
                        </div>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span>By ${c.author}</span>
                            <span>解锁: ${c.unlock_time ? c.unlock_time.slice(0, 16).replace('T', ' ') : ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderCountdowns();
        }

        async function loadCapsules() {
            try {
                const res = await fetch('/api/capsules');
                if (res.ok) {
                    allCapsules = await res.json();
                    renderCapsules();
                } else {
                    document.getElementById('capsules-grid').innerHTML = '<p class="text-gray-500 col-span-full text-center py-20">加载失败</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('capsules-grid').innerHTML = '<p class="text-gray-500 col-span-full text-center py-20">加载失败，请检查网络</p>';
            }
        }

        loadCapsules();
        setInterval(renderCountdowns, 1000);
    </script>
</body>
</html>
