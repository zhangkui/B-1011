<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解码 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4" id="nav-links"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-xl mx-auto text-center">
            <h2 class="text-4xl font-bold mb-4">解码器</h2>
            <p class="text-gray-400 mb-12">上传二维码图片以解锁其中的记忆。</p>

            <div class="glass p-10 rounded-2xl">
                <form id="decode-form">
                    <div class="mb-8">
                        <div class="relative border-2 border-dashed border-gray-600 rounded-lg p-12 hover:border-cyber-neon transition cursor-pointer group">
                            <input type="file" name="qr_image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="uploadAndDecode(this)">
                            <div class="text-gray-400 group-hover:text-cyber-neon transition">
                                <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span class="block text-lg font-bold">上传二维码图片</span>
                            </div>
                        </div>
                    </div>
                </form>
                <div id="status-msg" class="text-sm"></div>
            </div>
        </div>
    </main>
    <script src="/static/js/main.js"></script>
    <script>
        async function uploadAndDecode(input) {
            if (input.files && input.files[0]) {
                const formData = new FormData();
                formData.append('qr_image', input.files[0]);
                const status = document.getElementById('status-msg');
                status.textContent = '正在解码...';
                status.className = 'text-sm text-gray-400';

                try {
                    const res = await fetch('/api/decode', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (res.ok) {
                        status.textContent = '解码成功，正在跳转...';
                        const targetUrl = data.view_url || `/view_memory.html?id=${data.memory_id}`;
                        window.location.href = targetUrl;
                    } else if (res.status === 401 && data.error === 'auth_required') {
                        const viewUrl = data.redirect_url || `/view_memory.html?id=${data.memory_id}`;
                        const loginUrl = `/login.html?redirect=${encodeURIComponent(viewUrl)}`;
                        status.innerHTML = `<span class="text-yellow-400">发现加密记忆。请 <a href="${loginUrl}" class="underline font-bold">登录</a> 后查看。登录后将自动跳转到记忆页面。</span>`;
                    } else {
                        status.textContent = data.message || '无效的二维码';
                        status.className = 'text-red-500 text-sm';
                    }
                } catch (err) {
                    console.error(err);
                    status.textContent = '发生错误，请重试';
                    status.className = 'text-red-500 text-sm';
                }
            }
        }
    </script>
</body>
</html>
