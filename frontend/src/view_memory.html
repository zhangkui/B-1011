<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看记忆 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-draft { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-archived { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }
        .countdown-digit {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(244, 114, 182, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 70px;
            text-align: center;
        }
        .action-btn {
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        .action-btn:hover { transform: translateY(-1px); }
        .action-btn.active {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.2), rgba(56, 189, 248, 0.2));
        }
        .like-btn.active svg { fill: #f472b6; color: #f472b6; }
        .favorite-btn.active svg { fill: #fbbf24; color: #fbbf24; }
        .card-color-warm { background: linear-gradient(135deg, #7c2d12, #9a3412); }
        .card-color-cool { background: linear-gradient(135deg, #0c4a6e, #075985); }
        .card-color-rose { background: linear-gradient(135deg, #831843, #9f1239); }
        .card-color-gold { background: linear-gradient(135deg, #713f12, #854d0e); }
        .card-color-sky { background: linear-gradient(135deg, #0c4a6e, #0369a1); }
        .card-color-earth { background: linear-gradient(135deg, #365314, #3f6212); }
        .emoji-response { transition: transform 0.15s ease; }
        .emoji-response:hover { transform: scale(1.3); }
        .emoji-response.active {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 8px;
        }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(244, 114, 182, 0.3));
            color: #fff;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        .modal-content {
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        .modal-overlay.visible .modal-content { transform: scale(1); }
        .message-reply-form { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .message-reply-form.open { max-height: 200px; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .card-template-preview {
            aspect-ratio: 4/5; border-radius: 12px; position: relative;
            overflow: hidden; cursor: pointer; transition: transform 0.2s ease;
            border: 2px solid transparent;
        }
        .card-template-preview:hover { transform: translateY(-2px); }
        .card-template-preview.selected { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4" id="nav-links"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <div class="mb-8 flex items-center justify-between">
                <a href="/dashboard.html" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm">
                    &larr; 返回我的记忆
                </a>
                <div id="action-buttons" class="hidden flex items-center gap-3">
                    <button onclick="deleteMemory()" class="text-red-400 hover:text-red-300 text-sm flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-red-500/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        删除
                    </button>
                    <a id="edit-btn" href="#" class="bg-cyber-light text-cyber-dark px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-400 transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        编辑
                    </a>
                </div>
            </div>

            <div class="glass rounded-2xl overflow-hidden shadow-2xl border-t-4 border-cyber-neon" id="memory-container">
                <div class="p-12 text-center text-gray-500">加载中...</div>
            </div>

            <div id="qr-section" class="mt-8 glass rounded-2xl p-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">记忆二维码</h3>
                    <a id="design-qr-btn" href="#" class="text-cyber-light text-sm hover:underline">重新设计 &rarr;</a>
                </div>
                <div class="flex items-center justify-center">
                    <img id="qr-image" src="" alt="Memory QR Code" class="max-h-64 rounded-xl shadow-lg">
                </div>
            </div>

            <div id="collab-section" class="mt-8 hidden">
                <div class="glass rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold flex items-center gap-2">
                            <svg class="w-5 h-5 text-cyber-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            协作
                        </h3>
                        <a id="collab-manage-btn" href="#" class="text-cyber-light text-sm hover:underline">管理协作 &rarr;</a>
                    </div>
                    <div id="collab-members" class="flex flex-wrap gap-2 mb-4"></div>
                    <div id="collab-recent-activity" class="border-t border-gray-700/50 pt-4">
                        <h4 class="text-sm font-medium text-gray-400 mb-3">最近动态</h4>
                        <div id="collab-logs-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <div id="comments-section" class="mt-8 hidden">
                <div class="glass rounded-2xl p-6">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        协作留言
                    </h3>
                    <div id="comments-list" class="space-y-3 mb-4 max-h-64 overflow-y-auto"></div>
                    <div id="comment-form" class="hidden">
                        <div class="flex gap-2">
                            <input id="comment-input" type="text" maxlength="500" placeholder="写下你的留言..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light">
                            <button onclick="submitComment()" class="bg-cyber-neon text-black px-4 py-2 rounded-lg text-sm font-bold hover:bg-pink-400 transition">发送</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="interactive-section" class="mt-8 hidden">
                <div class="glass rounded-2xl p-6">
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-700/50 pb-3 overflow-x-auto">
                        <button onclick="switchTab('messages')" id="tab-messages" class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                            访客留言 <span id="msg-count-badge" class="ml-1 text-xs opacity-70">(0)</span>
                        </button>
                        <button onclick="switchTab('blessing')" id="tab-blessing" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                            祝福卡片 <span id="card-count-badge" class="ml-1 text-xs opacity-70">(0)</span>
                        </button>
                    </div>

                    <div id="tab-content-messages">
                        <div id="messages-list" class="space-y-4 mb-6 max-h-96 overflow-y-auto scrollbar-thin"></div>
                        <div id="message-form-area" class="border-t border-gray-700/50 pt-4">
                            <div id="message-form" class="space-y-3">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <input id="msg-name" type="text" maxlength="50" placeholder="你的昵称（留空则匿名）" class="flex-1 min-w-40 bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light">
                                    <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                                        <input type="checkbox" id="msg-anonymous" class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-cyber-light focus:ring-cyber-light">
                                        匿名留言
                                    </label>
                                </div>
                                <textarea id="msg-content" maxlength="1000" rows="3" placeholder="写下你想说的话..." class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light resize-none"></textarea>
                                <div class="flex items-center justify-between flex-wrap gap-2">
                                    <div class="text-xs text-gray-500">
                                        <span id="msg-char-count">0</span>/1000 字
                                    </div>
                                    <button onclick="submitGuestMessage()" class="bg-cyber-neon text-black px-5 py-2 rounded-lg text-sm font-bold hover:bg-pink-400 transition flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                        发送留言
                                    </button>
                                </div>
                            </div>
                            <div id="message-access-denied" class="hidden text-center py-6">
                                <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                <p id="access-denied-msg" class="text-gray-500 text-sm">解锁后即可留言</p>
                            </div>
                        </div>
                    </div>

                    <div id="tab-content-blessing" class="hidden">
                        <div id="blessing-cards-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 max-h-96 overflow-y-auto scrollbar-thin"></div>
                        <div class="border-t border-gray-700/50 pt-4">
                            <button onclick="openBlessingModal()" class="w-full bg-gradient-to-r from-cyber-light to-cyber-neon text-cyber-dark px-5 py-3 rounded-xl text-sm font-bold hover:opacity-90 transition flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                发送祝福卡片
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="blessing-modal" class="modal-overlay">
                <div class="modal-content glass rounded-2xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold gradient-text">发送祝福卡片</h3>
                        <button onclick="closeBlessingModal()" class="text-gray-400 hover:text-white transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">选择样式</label>
                            <div id="card-template-select" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">选择色调</label>
                            <div id="card-color-select" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">你的昵称</label>
                                <input id="card-sender" type="text" maxlength="50" placeholder="留空则匿名" class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">送给（可选）</label>
                                <input id="card-recipient" type="text" maxlength="50" placeholder="收件人昵称" class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light">
                            </div>
                        </div>
                        <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                            <input type="checkbox" id="card-anonymous" class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-cyber-light focus:ring-cyber-light">
                            匿名发送
                        </label>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">祝福内容</label>
                            <textarea id="card-content" maxlength="1000" rows="4" placeholder="写下你的祝福语..." class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light resize-none"></textarea>
                            <div class="text-xs text-gray-500 text-right mt-1">
                                <span id="card-char-count">0</span>/1000 字
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button onclick="closeBlessingModal()" class="px-5 py-2 rounded-lg border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition text-sm">取消</button>
                            <button onclick="submitBlessingCard()" id="card-submit-btn" class="bg-cyber-neon text-black px-5 py-2 rounded-lg text-sm font-bold hover:bg-pink-400 transition">发送祝福</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="share-modal" class="modal-overlay">
                <div class="modal-content glass rounded-2xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold gradient-text">分享记忆</h3>
                        <button onclick="closeShareModal()" class="text-gray-400 hover:text-white transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h4 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
                                <svg class="w-4 h-4 text-cyber-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                短链接
                            </h4>
                            <div id="short-link-area" class="space-y-3">
                                <div class="flex gap-2">
                                    <input type="text" id="short-link-input" readonly class="flex-1 bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-sm text-cyber-light focus:outline-none" placeholder="点击下方按钮生成短链接">
                                    <button onclick="copyShortLink()" id="copy-short-btn" class="bg-gray-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-600 transition disabled:opacity-50" disabled>
                                        复制
                                    </button>
                                </div>
                                <div class="flex gap-2 flex-wrap">
                                    <input type="text" id="custom-short-code" maxlength="12" placeholder="自定义短码（可选，4-12字符）" class="flex-1 min-w-40 bg-gray-800 border border-gray-700 rounded-lg py-2 px-3 text-sm text-white focus:outline-none focus:border-cyber-light">
                                    <button onclick="generateShortLink()" class="bg-cyber-light text-cyber-dark px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-400 transition whitespace-nowrap">
                                        生成短链接
                                    </button>
                                </div>
                                <div id="short-link-info" class="hidden text-xs text-gray-500 bg-gray-800/50 rounded-lg p-3">
                                    <div class="flex items-center justify-between">
                                        <span>点击次数</span>
                                        <span id="short-link-clicks" class="text-cyber-light font-semibold">0</span>
                                    </div>
                                    <div class="flex items-center justify-between mt-1">
                                        <span>创建时间</span>
                                        <span id="short-link-created" class="text-gray-400">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-gray-700/50 pt-5">
                            <h4 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
                                <svg class="w-4 h-4 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                分享海报
                            </h4>
                            <div class="space-y-3">
                                <div class="flex flex-wrap gap-2">
                                    <span class="text-xs text-gray-400 self-center mr-1">风格：</span>
                                    <button onclick="selectPosterStyle('elegant')" data-style="elegant" class="poster-style-btn px-3 py-1 rounded-full text-xs border border-cyber-light/50 bg-cyber-light/20 text-cyber-light">优雅</button>
                                    <button onclick="selectPosterStyle('warm')" data-style="warm" class="poster-style-btn px-3 py-1 rounded-full text-xs border border-gray-600 text-gray-400 hover:border-orange-400/50 hover:text-orange-400">温暖</button>
                                    <button onclick="selectPosterStyle('romantic')" data-style="romantic" class="poster-style-btn px-3 py-1 rounded-full text-xs border border-gray-600 text-gray-400 hover:border-pink-400/50 hover:text-pink-400">浪漫</button>
                                    <button onclick="selectPosterStyle('memorial')" data-style="memorial" class="poster-style-btn px-3 py-1 rounded-full text-xs border border-gray-600 text-gray-400 hover:border-yellow-400/50 hover:text-yellow-400">纪念</button>
                                </div>
                                <div class="flex gap-2 flex-wrap">
                                    <span class="text-xs text-gray-400 self-center mr-1">尺寸：</span>
                                    <button onclick="selectPosterWidth(750)" data-width="750" class="poster-width-btn px-3 py-1 rounded-full text-xs border border-cyber-neon/50 bg-cyber-neon/20 text-cyber-neon">朋友圈 (750)</button>
                                    <button onclick="selectPosterWidth(1080)" data-width="1080" class="poster-width-btn px-3 py-1 rounded-full text-xs border border-gray-600 text-gray-400 hover:border-gray-500 hover:text-gray-300">高清 (1080)</button>
                                    <button onclick="selectPosterWidth(375)" data-width="375" class="poster-width-btn px-3 py-1 rounded-full text-xs border border-gray-600 text-gray-400 hover:border-gray-500 hover:text-gray-300">手机 (375)</button>
                                </div>
                                <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">

    <div id="toast" class="fixed top-20 right-4 transform translate-x-full transition-transform duration-300 z-50">

    </div>

    <script src="/static/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const memoryId = urlParams.get('id');
        let memoryData = null;

        function getStatusLabel(status) {
            const labels = {
                'active': '正常',
                'draft': '草稿',
                'archived': '已归档'
            };
            return labels[status] || status;
        }

        function getStatusClass(status) {
            return 'status-' + (status || 'active');
        }

        function getCountdown(targetTimeStr) {
            const target = new Date(targetTimeStr.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return null;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return { days, hours, minutes, seconds };
        }

        let countdownTimer = null;
        function startCountdown(timeStr) {
            function update() {
                const el = document.getElementById('countdown-display');
                if (!el) return;
                const cd = getCountdown(timeStr);
                if (!cd) {
                    el.innerHTML = '<div class="text-green-400 font-bold text-2xl">已解锁！刷新页面查看内容</div>';
                    if (countdownTimer) clearInterval(countdownTimer);
                    return;
                }
                el.innerHTML = `
                    <div class="flex items-center justify-center gap-3">
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.days}</div>
                            <div class="text-xs text-gray-500">天</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.hours}</div>
                            <div class="text-xs text-gray-500">时</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.minutes}</div>
                            <div class="text-xs text-gray-500">分</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.seconds}</div>
                            <div class="text-xs text-gray-500">秒</div>
                        </div>
                    </div>
                `;
            }
            update();
            countdownTimer = setInterval(update, 1000);
        }

        function getVisibilityLabel(visibility) {
            return visibility === 'public' ? '公开' : '私有';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            content.className = 'glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3';
            if (type === 'success') {
                content.classList.add('border-green-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>${message}</span>
                `;
            } else {
                content.classList.add('border-red-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>${message}</span>
                `;
            }
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function deleteMemory() {
            showDeleteModal();
        }

        async function confirmDelete() {
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = true;
            btn.textContent = '删除中...';

            try {
                const res = await fetch(`/api/memories/${memoryId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('删除成功');
                    closeDeleteModal();
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showToast('删除失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认删除';
                }
            } catch (err) {
                console.error(err);
                showToast('删除出错', 'error');
                btn.disabled = false;
                btn.textContent = '确认删除';
            }
        }

        const roleBadgeColors = {
            'owner': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
            'editor': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
            'viewer': 'bg-gray-500/20 text-gray-400 border-gray-500/30',
            'commenter': 'bg-pink-500/20 text-pink-400 border-pink-500/30'
        };
        const roleLabels = {
            'owner': '创建者',
            'editor': '编辑者',
            'viewer': '查看者',
            'commenter': '留言者'
        };

        let myRole = null;
        let currentLat = null;
        let currentLon = null;
        let unlockSessionId = null;

        async function getCurrentPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('浏览器不支持地理定位'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        resolve({ lat: currentLat, lon: currentLon });
                    },
                    (err) => reject(err),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        function renderGeoLocked(m) {

            container.innerHTML = `
                <div class="p-8 md:p-16 text-center">
                    <div class="w-28 h-28 mx-auto bg-cyber-light/20 rounded-full flex items-center justify-center mb-8 border border-cyber-light/30">
                        <svg class="w-14 h-14 text-cyber-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>

                        ${m.unlock_time ? `

                    <p class="text-gray-400 mb-6 max-w-md mx-auto">

                    ${m.geo_message ? `

                    <div class="mb-8">

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

        }

            const activeSessions = m.group_active_sessions || [];
            const userParticipatingSession = activeSessions.find(s => s.is_participant);
            const hasJoinableSessions = activeSessions.some(s => !s.is_participant);

            let sessionsHtml = '';
            if (activeSessions.length > 0) {
                sessionsHtml = `

                        <div class="space-y-3">
                            ${activeSessions.map((s, index) => `
                                <div class="p-4 bg-gray-800/50 rounded-lg border ${s.is_participant ? 'border-cyber-neon/50 bg-cyber-neon/5' : 'border-gray-700'} text-left">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm font-medium ${s.is_participant ? 'text-cyber-neon' : 'text-gray-300'}">

                                        ${s.is_participant ? `

                                            </button>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center justify-between mb-2 text-sm">
                                        <span class="text-gray-400">进度</span>
                                        <span class="text-cyber-neon font-bold">${s.current_count} / ${s.required_count} 人</span>
                                    </div>
                                    <div class="h-2 bg-gray-700 rounded-full overflow-hidden mb-3">
                                        <div class="h-full bg-gradient-to-r from-cyber-light to-cyber-neon transition-all duration-500" style="width: ${(s.current_count / s.required_count) * 100}%"></div>
                                    </div>
                                    ${!s.is_participant ? `
                                        <button onclick="joinSpecificSession(${s.id})" class="w-full bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30 py-2 rounded-lg text-sm font-medium hover:bg-cyber-neon/30 transition">

            container.innerHTML = `

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>

                    <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-4">${m.title}</h1>

                    <div class="flex items-center justify-center gap-3 mb-6 text-sm flex-wrap">
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                            👥 多人联合解锁
                        </span>
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-gray-700/50 text-gray-300 border border-gray-600">
                            需要 ${m.group_unlock_count} 人
                        </span>
                        ${m.unlock_time ? `
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                            🔒 时光胶囊已锁定
                        </span>
                        ` : ''}
                    </div>

                    <p class="text-gray-400 mb-6 max-w-md mx-auto">
                        此记忆设置了多人联合解锁。您可以加入现有的解锁团，或者发起新的解锁团。凑齐 <span class="text-cyber-neon font-medium">${m.group_unlock_count}</span> 人后，所有参与者都可查看内容。
                    </p>

                    ${m.group_message ? `
                    <div class="mb-6 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                        <p class="text-yellow-400 text-sm">${m.group_message}</p>
                    </div>
                    ` : ''}

                    ${sessionsHtml}

                    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-6">

                        </button>

                        </button>

        async function checkGeoUnlock() {
            const btn = document.getElementById('check-location-btn');
            const statusEl = document.getElementById('geo-status');
            if (!btn || !statusEl) return;

            btn.disabled = true;
            btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 获取位置中...';
            statusEl.textContent = '';

            try {
                await getCurrentPosition();
                
                const res = await fetch(`/api/memories/${memoryId}?lat=${currentLat}&lon=${currentLon}`);
                if (res.ok) {
                    const data = await res.json();
                    memoryData = data;
                    
                    if (data.geo_locked) {
                        statusEl.textContent = data.geo_message || '位置验证失败，请前往指定地点';
                        statusEl.className = 'text-sm text-yellow-400';
                    } else {
                        statusEl.textContent = '位置验证成功！';
                        statusEl.className = 'text-sm text-green-400';
                        setTimeout(() => loadMemory(), 500);
                        return;
                    }
                }
            } catch (err) {
                let message = '获取位置失败';
                if (err.code === err.PERMISSION_DENIED) {
                    message = '您拒绝了位置权限请求，请在浏览器设置中允许访问位置';
                } else if (err.code === err.POSITION_UNAVAILABLE) {
                    message = '位置信息不可用';
                } else if (err.code === err.TIMEOUT) {
                    message = '获取位置超时，请重试';
                }
                statusEl.textContent = message;
                statusEl.className = 'text-sm text-red-400';
            }

            btn.disabled = false;
            btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 重新验证位置';
        }

        async function startGroupUnlock() {
            const container = document.getElementById('memory-container');
            const btn = document.getElementById('start-unlock-btn');
            const statusEl = document.getElementById('group-status');
            if (!btn || !statusEl) return;

            btn.disabled = true;
            btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 处理中...';
            statusEl.textContent = '';

            try {
                const body = {};
                if (currentLat && currentLon) {
                    body.lat = currentLat;
                    body.lon = currentLon;
                }

        async function joinGroupUnlock(sessionId = null) {

            const statusEl = document.getElementById('group-status');

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 处理中...';

            statusEl.textContent = '';

                const body = {};

                    body.lat = currentLat;
                    body.lon = currentLon;
                }
                if (sessionId) {
                    body.session_id = sessionId;
                }

                const res = await fetch(`/api/memories/${memoryId}/unlock/group/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();
                if (data.success) {
                    unlockSessionId = data.session.id;
                    statusEl.textContent = data.message || '参与成功';
                    statusEl.className = 'text-sm text-green-400';
                    
                    if (data.unlocked) {
                        if (btn) {
                            btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 解锁成功！';

                        setTimeout(() => loadMemory(), 800);
                    } else {
                        const shareSection = document.getElementById('share-section');
                        const unlockLinkInput = document.getElementById('unlock-link');
                        if (shareSection && unlockLinkInput) {
                            unlockLinkInput.value = data.session.unlock_link;
                            shareSection.classList.remove('hidden');
                        }

                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 已参与';

                        if (sessionId) {
                            setTimeout(() => loadMemory(), 500);
                        } else {
                            const progressBar = container.querySelector('.h-3 > div');
                            const countSpan = container.querySelector('.text-cyber-neon.font-bold');
                            if (progressBar && countSpan && data.session) {
                                progressBar.style.width = `${(data.session.current_count / data.session.required_count) * 100}%`;
                                countSpan.textContent = `${data.session.current_count} / ${data.session.required_count} 人`;

                    if (btn) {

                        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg> 重新参与';

                statusEl.textContent = '网络错误，请重试';
                statusEl.className = 'text-sm text-red-400';
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg> 重新参与';

        async function loadCollabInfo() {
            if (!memoryId) return;
            try {
                const roleRes = await fetch(`/api/collab/${memoryId}/my-role`);
                if (!roleRes.ok) return;
                const roleData = await roleRes.json();
                if (!roleData.role) return;
                myRole = roleData.role;

                document.getElementById('collab-section').classList.remove('hidden');
                document.getElementById('collab-manage-btn').href = `/collaborate.html?id=${memoryId}`;

                const membersRes = await fetch(`/api/collab/${memoryId}/members`);
                if (membersRes.ok) {
                    const membersData = await membersRes.json();
                    const membersDiv = document.getElementById('collab-members');
                    membersDiv.innerHTML = membersData.members.map(m => {
                        const colors = roleBadgeColors[m.role] || roleBadgeColors['viewer'];
                        const label = roleLabels[m.role] || m.role;
                        return `<div class="flex items-center gap-2 bg-gray-800/50 px-3 py-1.5 rounded-full">
                            <div class="w-6 h-6 rounded-full bg-cyber-light/20 flex items-center justify-center text-xs font-bold text-cyber-light">${(m.username || '?')[0].toUpperCase()}</div>
                            <span class="text-sm text-gray-300">${m.username}</span>
                            <span class="text-xs px-1.5 py-0.5 rounded-full border ${colors}">${label}</span>
                        </div>`;
                    }).join('');
                }

                const logsRes = await fetch(`/api/collab/${memoryId}/logs?per_page=5`);
                if (logsRes.ok) {
                    const logsData = await logsRes.json();
                    const logsDiv = document.getElementById('collab-logs-list');
                    if (logsData.logs.length === 0) {
                        logsDiv.innerHTML = '<p class="text-xs text-gray-600">暂无动态</p>';
                    } else {
                        logsDiv.innerHTML = logsData.logs.map(l => `
                            <div class="flex items-start gap-2 text-xs">
                                <span class="text-cyber-light font-medium shrink-0">${l.username}</span>
                                <span class="text-gray-500">${l.detail || l.action}</span>
                                <span class="text-gray-700 shrink-0 ml-auto">${l.created_at}</span>
                            </div>
                        `).join('');
                    }
                }

                const commentsRes = await fetch(`/api/collab/${memoryId}/comments`);
                if (commentsRes.ok) {
                    const commentsData = await commentsRes.json();
                    if (commentsData.comments.length > 0 || roleData.can_comment) {
                        document.getElementById('comments-section').classList.remove('hidden');
                        renderComments(commentsData.comments);
                        if (roleData.can_comment) {
                            document.getElementById('comment-form').classList.remove('hidden');
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to load collab info:', err);
            }
        }

        function renderComments(comments) {
            const list = document.getElementById('comments-list');
            if (comments.length === 0) {
                list.innerHTML = '<p class="text-sm text-gray-600">暂无留言</p>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="flex items-start gap-3 p-3 bg-gray-800/30 rounded-lg">
                    <div class="w-8 h-8 rounded-full bg-cyber-neon/20 flex items-center justify-center text-xs font-bold text-cyber-neon shrink-0">${(c.username || '?')[0].toUpperCase()}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-sm font-medium text-gray-200">${c.username}</span>
                            <span class="text-xs text-gray-600">${c.created_at}</span>
                        </div>
                        <p class="text-sm text-gray-400 break-words">${c.content}</p>
                    </div>
                </div>
            `).join('');
        }

        async function submitComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`/api/collab/${memoryId}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    const commentsRes = await fetch(`/api/collab/${memoryId}/comments`);
                    if (commentsRes.ok) {
                        const commentsData = await commentsRes.json();
                        renderComments(commentsData.comments);
                    }
                } else {
                    showToast(data.message || '留言失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function loadMemory() {
            const container = document.getElementById('memory-container');

            try {
                let url = `/api/memories/${memoryId}`;
                if (currentLat && currentLon) {
                    url += `?lat=${currentLat}&lon=${currentLon}`;
                }
                const res = await fetch(url);

                if (res.status === 401) {
                    const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `/login.html?redirect=${currentUrl}`;
                    return;
                }

                if (res.status === 403) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">无权访问此记忆</div>';
                    return;
                }

                if (res.status === 404) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">记忆不存在或已被删除</div>';
                    return;
                }

                if (!res.ok) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">加载失败，请稍后重试</div>';
                    return;
                }

                const m = await res.json();
                memoryData = m;

                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }

                if (m.is_locked) {
                    if (m.time_locked !== false) {

                        document.getElementById('qr-section').classList.add('hidden');

                        container.innerHTML = `
                            <div class="p-8 md:p-16 text-center">

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>

                                    </span>
                                    ${m.geo_locked ? `

                                    </span>
                                    ` : ''}
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium ${m.visibility === 'public' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-gray-500/20 text-gray-400 border border-gray-500/30'}">

            const btn = document.getElementById('like-btn');

            if (!btn || !countEl) return;

            btn.disabled = true;
            try {
                const res = await fetch(`/api/memories/${memoryId}/like`, { method: 'POST' });
                if (res.status === 401) {
                    const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `/login.html?redirect=${currentUrl}`;

                const data = await res.json();

                        btn.querySelector('svg').classList.add('text-gray-400');
                        btn.querySelector('svg').classList.remove('text-pink-500');
                        countEl.classList.remove('text-pink-400', 'font-semibold');
                        countEl.classList.add('text-gray-400');
                    }
                    countEl.textContent = data.likes_count;

                console.error(err);
                showToast('操作失败', 'error');

                btn.disabled = false;

                if (t === tab) {

            section.classList.remove('hidden');

            document.getElementById('card-count-badge').textContent = `(${memoryData.blessing_cards_count || 0})`;

            const user_lon = (typeof currentLon !== 'undefined') ? currentLon : null;
            const checkAccessBody = {};
            if (user_lat) checkAccessBody.lat = user_lat;
            if (user_lon) checkAccessBody.lon = user_lon;

            try {
                const testRes = await fetch(`/api/memories/${memoryId}/guest-messages?per_page=1`, {
                    method: 'POST' in {} ? 'GET' : 'GET',

                });
            } catch (e) {}

            const m = memoryData;

                else if (m.group_locked) reason = '需要完成多人联合解锁后才能留言';

        async function submitGuestMessage() {
            if (!memoryId || !canSendMessages) return;

            const nameInput = document.getElementById('msg-name');
            const contentInput = document.getElementById('msg-content');
            const anonCheckbox = document.getElementById('msg-anonymous');
            if (!nameInput || !contentInput) return;

            const content = contentInput.value.trim();
            const guestName = nameInput.value.trim();
            const isAnonymous = anonCheckbox.checked;

            if (!content) {
                showToast('请输入留言内容', 'error');
                return;
            }
            if (!isAnonymous && !guestName) {
                showToast('请填写昵称或选择匿名留言', 'error');
                return;
            }

            const body = {
                content,
                guest_name: guestName,
                is_anonymous: isAnonymous,
                message_type: 'message'
            };
            if (typeof currentLat !== 'undefined' && currentLat) body.lat = currentLat;
            if (typeof currentLon !== 'undefined' && currentLon) body.lon = currentLon;

            try {
                const res = await fetch(`/api/memories/${memoryId}/guest-messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    contentInput.value = '';
                    document.getElementById('msg-char-count').textContent = '0';
                    if (memoryData) memoryData.messages_count = (memoryData.messages_count || 0) + 1;
                    document.getElementById('msg-count-badge').textContent = `(${memoryData.messages_count})`;
                    showToast('留言发送成功');
                    loadGuestMessages();
                    loadAnonymousResponses();
                } else {
                    showToast(data.message || '留言失败', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('网络错误', 'error');
            }
        }

        function toggleReplyForm(msgId) {
            const form = document.getElementById(`reply-form-${msgId}`);
            if (form) form.classList.toggle('open');
        }

        async function submitReply(parentId) {
            if (!memoryId || !canSendMessages) return;

            const input = document.getElementById(`reply-input-${parentId}`);
            if (!input) return;
            const content = input.value.trim();
            if (!content) return;

            const nameInput = document.getElementById('msg-name');
            const anonCheckbox = document.getElementById('msg-anonymous');
            const guestName = nameInput ? nameInput.value.trim() : '';
            const isAnonymous = anonCheckbox ? anonCheckbox.checked : true;

            const body = {
                content,
                guest_name: guestName,
                is_anonymous: isAnonymous || !guestName,
                parent_id: parentId,
                message_type: 'message'
            };
            if (typeof currentLat !== 'undefined' && currentLat) body.lat = currentLat;
            if (typeof currentLon !== 'undefined' && currentLon) body.lon = currentLon;

            try {
                const res = await fetch(`/api/memories/${memoryId}/guest-messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    toggleReplyForm(parentId);
                    showToast('回复成功');
                    loadGuestMessages();
                } else {
                    showToast(data.message || '回复失败', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('网络错误', 'error');
            }
        }

        async function sendEmojiResponse(targetType, targetId, emoji) {
            if (!memoryId) return;
            const body = {
                target_type: targetType,
                target_id: targetId,
                response_type: 'emoji',
                content: emoji
            };
            if (typeof currentLat !== 'undefined' && currentLat) body.lat = currentLat;
            if (typeof currentLon !== 'undefined' && currentLon) body.lon = currentLon;

            try {
                const res = await fetch(`/api/memories/${memoryId}/anonymous-responses`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    loadAnonymousResponses();
                    setTimeout(() => {
                        if (targetType === 'message') loadGuestMessages();
                        else if (targetType === 'card') loadBlessingCards();
                    }, 100);
                }
            } catch (err) {
                    console.error(err);
                }
        }

            if (!memoryId) return;

                const res = await fetch(`/api/memories/${memoryId}/anonymous-responses`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        responseSummary = data.summary || {};
                    }

                console.error(err);

        async function submitBlessingCard() {
            if (!memoryId || !canSendMessages) return;

            const senderInput = document.getElementById('card-sender');
            const recipientInput = document.getElementById('card-recipient');
            const contentInput = document.getElementById('card-content');
            const anonCheckbox = document.getElementById('card-anonymous');
            const submitBtn = document.getElementById('card-submit-btn');

            const sender = senderInput.value.trim();
            const recipient = recipientInput.value.trim();
            const content = contentInput.value.trim();
            const isAnonymous = anonCheckbox.checked;

            if (!content) {
                showToast('请输入祝福内容', 'error');
                return;
            }
            if (!isAnonymous && !sender) {
                showToast('请填写昵称或选择匿名发送', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';

            const body = {
                content,
                sender_name: sender,
                recipient_name: recipient || null,
                card_template: selectedCardTemplate,
                card_color: selectedCardColor,
                is_anonymous: isAnonymous || !sender
            };
            if (typeof currentLat !== 'undefined' && currentLat) body.lat = currentLat;
            if (typeof currentLon !== 'undefined' && currentLon) body.lon = currentLon;

            try {
                const res = await fetch(`/api/memories/${memoryId}/blessing-cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                    recipientInput.value = '';
                    contentInput.value = '';
                    anonCheckbox.checked = false;
                    document.getElementById('card-char-count').textContent = '0';

                    submitBtn.disabled = false;
                    submitBtn.textContent = '发送祝福';
                }

            if (!list) return;
            if (cards.length === 0) {
                list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 text-sm"><svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9.414M3 7l9-4 9 4M16 11H8"></path></svg>暂无祝福卡片，送出你的第一份祝福吧</div>';
                return;
            }
            list.innerHTML = cards.map(card => {
                const emojiSummary = responseSummary[`card_${card.id}`] || {};
                const emojiBar = Object.entries(emojiSummary).map(([emoji, count]) => `
                    <button onclick="sendEmojiResponse('card', ${card.id}, '${emoji}')" class="text-xs px-1.5 py-0.5 rounded-full bg-black/20 hover:bg-black/30 transition">
                        ${emoji} <span class="opacity-70">${count}</span>
                    </button>
                `).join('');
                const emojis = EMOJI_OPTIONS.slice(0, 5).map(e => `
                    <button onclick="sendEmojiResponse('card', ${card.id}, '${e}')" class="emoji-response text-xs px-1 transition hover:scale-125" title="${e}">${e}</button>
                `).join('');
                return `
                    <div class="card-color-${card.card_color} rounded-xl p-5 shadow-xl border border-white/10 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-10 -mt-10"></div>
                        <div class="relative z-10">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-sm">${(card.sender_name || '?')[0].toUpperCase()}</div>
                                    <div>
                                        <div class="text-sm font-medium text-white/90">${card.sender_name}${card.is_anonymous ? ' <span class="text-[10px] text-white/50">(匿名)</span>' : ''}</div>
                                        <div class="text-[10px] text-white/40">${card.created_at}</div>
                                    </div>
                                </div>
                                ${card.recipient_name ? `<div class="text-xs text-white/60">致 <span class="text-white/80">${card.recipient_name}</span></div>' : ''}
                            </div>
                            <div class="my-4 text-white/90 text-sm leading-relaxed break-words whitespace-pre-wrap">${card.content}</div>
                            <div class="flex items-center gap-1.5 flex-wrap mt-4 pt-3 border-t border-white/10">
                                ${emojiBar}
                                <div class="flex items-center gap-0.5 ml-auto">
                                    ${emojis}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openShareModal() {
            if (!memoryId) return;
            document.getElementById('share-modal').classList.add('visible');
            listExistingShortLinks();
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('visible');
        }

        async function generateShortLink() {
            if (!memoryId) return;
            const codeInput = document.getElementById('custom-short-code');
            const customCode = codeInput ? codeInput.value.trim() : '';
            const body = {};
            if (customCode) body.custom_code = customCode;

            try {
                const res = await fetch(`/api/memories/${memoryId}/short-link`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.status === 401) {
                const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                window.location.href = `/login.html?redirect=${currentUrl}`;
                return;
            }
            const data = await res.json();
            if (data.success) {
                const input = document.getElementById('short-link-input');
                const copyBtn = document.getElementById('copy-short-btn');
                const info = document.getElementById('short-link-info');
                input.value = data.short_link.short_url;
                copyBtn.disabled = false;
                info.classList.remove('hidden');
                document.getElementById('short-link-clicks').textContent = data.short_link.click_count || 0;
                document.getElementById('short-link-created').textContent = data.short_link.created_at || '-';
                showToast('短链接生成成功');
            } else {
                showToast(data.message || '生成失败', 'error');
            }
        }

        async function listExistingShortLinks() {
            if (!memoryId) return;
            try {
                const res = await fetch(`/api/memories/${memoryId}/short-links`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.short_links && data.short_links.length > 0) {
                        const latest = data.short_links[0];
                        document.getElementById('short-link-input').value = latest.short_url;
                        document.getElementById('copy-short-btn').disabled = false;
                        document.getElementById('short-link-info').classList.remove('hidden');
                        document.getElementById('short-link-clicks').textContent = latest.click_count || 0;
                        document.getElementById('short-link-created').textContent = latest.created_at || '-';
                    }
                }
            } catch (err) {}
        }

        function copyShortLink() {
            const input = document.getElementById('short-link-input');
            if (!input || !input.value) return;
            input.select();
            navigator.clipboard.writeText(input.value).then(() => {
                showToast('短链接已复制');
            }).catch(() => {
                document.execCommand('copy');
                showToast('短链接已复制');
            });
        }

        function selectPosterStyle(style) {
            currentPosterStyle = style;
            const btnMap = {
                'elegant': 'border-cyber-light/50 bg-cyber-light/20 text-cyber-light',
                'warm': 'border-orange-400/50 bg-orange-400/20 text-orange-400',
                'romantic': 'border-pink-400/50 bg-pink-400/20 text-pink-400',
                'memorial': 'border-yellow-400/50 bg-yellow-400/20 text-yellow-400'
            };
            const hovMap = {
                'elegant': 'hover:border-cyber-light/50 hover:text-cyber-light',
                'warm': 'hover:border-orange-400/50 hover:text-orange-400',
                'romantic': 'hover:border-pink-400/50 hover:text-pink-400',
                'memorial': 'hover:border-yellow-400/50 hover:text-yellow-400'
            };
            document.querySelectorAll('.poster-style-btn').forEach(btn => {
                const s = btn.dataset.style;
                const isActive = s === style;
                btn.className = 'poster-style-btn px-3 py-1 rounded-full text-xs border ';
                if (isActive) {
                    btn.className += btnMap[s] || btnMap['elegant'];
                } else {
                    btn.className += 'border-gray-600 text-gray-400 ' + (hovMap[s] || hovMap['elegant']);
                }
            });
        }

        function selectPosterWidth(width) {
            currentPosterWidth = width;
            const activeCls = 'border-cyber-neon/50 bg-cyber-neon/20 text-cyber-neon';
            const inactiveCls = 'border-gray-600 text-gray-400';
            document.querySelectorAll('.poster-width-btn').forEach(btn => {
                const isActive = parseInt(btn.dataset.width) === parseInt(width);
                btn.className = 'poster-width-btn px-3 py-1 rounded-full text-xs border ' + 
                    (isActive ? activeCls : (inactiveCls + ' hover:border-gray-500 hover:text-gray-300'));
            });
        }

        async function generatePoster() {
            if (!memoryId) return;
            const btn = document.getElementById('gen-poster-btn');
            const includeQr = document.getElementById('poster-include-qr');
            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 生成中...';

            try {
                const qrParam = includeQr && includeQr.checked ? 'true' : 'false';
                const res = await fetch(`/api/memories/${memoryId}/share-poster?style=${currentPosterStyle}&width=${currentPosterWidth}&include_qr=${qrParam}`);
                const data = await res.json();
                if (data.success) {
                    const preview = document.getElementById('poster-preview');
                    const img = document.getElementById('poster-image');
                    const download = document.getElementById('poster-download');
                    preview.classList.remove('hidden');
                    img.src = data.poster_url + '?t=' + Date.now();
                    download.href = data.poster_url;
                    download.download = `memory-poster-${memoryId.slice(0, 8)}.png`;
                    showToast('海报生成成功');
                } else {
                    showToast(data.message || '生成失败', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('网络错误', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        async function copyPosterImage() {
            const img = document.getElementById('poster-image');
            if (!img || !img.src) return;
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                showToast('海报已复制到剪贴板');
            } catch (err) {
                showToast('复制失败，请右键保存图片', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const msgContent = document.getElementById('msg-content');
            if (msgContent) {
                msgContent.addEventListener('input', function() {
                    document.getElementById('msg-char-count').textContent = this.value.length;
                });
            }
            const cardContent = document.getElementById('card-content');
            if (cardContent) {
                cardContent.addEventListener('input', function() {
                    document.getElementById('card-char-count').textContent = this.value.length;
                });
            }
            const msgAnon = document.getElementById('msg-anonymous');
            if (msgAnon) {
                msgAnon.addEventListener('change', function() {
                    document.getElementById('msg-name').disabled = this.checked;
                    if (this.checked) document.getElementById('msg-name').classList.add('opacity-50');
                    else document.getElementById('msg-name').classList.remove('opacity-50');
                });
            }
            const cardAnon = document.getElementById('card-anonymous');
            if (cardAnon) {
                cardAnon.addEventListener('change', function() {
                    document.getElementById('card-sender').disabled = this.checked;
                    if (this.checked) document.getElementById('card-sender').classList.add('opacity-50');
                    else document.getElementById('card-sender').classList.remove('opacity-50');
                });
            }
            document.getElementById('blessing-modal')?.addEventListener('click', function(e) {
                if (e.target === this) closeBlessingModal();
            });
            document.getElementById('share-modal')?.addEventListener('click', function(e) {
                if (e.target === this) closeShareModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeBlessingModal();
                    closeShareModal();
                }
            });
        });

        const _oldLoadCollabInfo = loadCollabInfo;
        loadCollabInfo = async function() {
            await _oldLoadCollabInfo();
            setTimeout(loadInteractiveSection, 200);
        };

        if (memoryId) {
            loadMemory();
        } else {
            document.getElementById('memory-container').innerHTML = '<div class="p-12 text-center text-red-500">无效的记忆ID</div>';
        }
    </script>
</body>
</html>
