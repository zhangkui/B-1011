<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看记忆 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-draft { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-archived { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }
        .countdown-digit {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(244, 114, 182, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4" id="nav-links"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <div class="mb-8 flex items-center justify-between">
                <a href="/dashboard.html" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm">
                    &larr; 返回我的记忆
                </a>
                <div id="action-buttons" class="hidden flex items-center gap-3">
                    <button onclick="deleteMemory()" class="text-red-400 hover:text-red-300 text-sm flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-red-500/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        删除
                    </button>
                    <a id="edit-btn" href="#" class="bg-cyber-light text-cyber-dark px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-400 transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        编辑
                    </a>
                </div>
            </div>

            <div class="glass rounded-2xl overflow-hidden shadow-2xl border-t-4 border-cyber-neon" id="memory-container">
                <div class="p-12 text-center text-gray-500">加载中...</div>
            </div>

            <div id="qr-section" class="mt-8 glass rounded-2xl p-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">记忆二维码</h3>
                    <a id="design-qr-btn" href="#" class="text-cyber-light text-sm hover:underline">重新设计 &rarr;</a>
                </div>
                <div class="flex items-center justify-center">
                    <img id="qr-image" src="" alt="Memory QR Code" class="max-h-64 rounded-xl shadow-lg">
                </div>
            </div>
        </div>
    </main>

    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="glass p-6 rounded-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="deleteModalContent">
            <h3 class="text-xl font-bold mb-4">确认删除</h3>
            <p class="text-gray-300 mb-6">确定要删除这个记忆吗？此操作无法撤销，相关的媒体文件和二维码也会被一并删除。</p>
            <div class="flex justify-end gap-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-colors text-sm">取消</button>
                <button onclick="confirmDelete()" id="confirmDeleteBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition-colors text-sm font-bold">确认删除</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 right-4 transform translate-x-full transition-transform duration-300 z-50">
        <div id="toastContent" class="glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3">
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const memoryId = urlParams.get('id');
        let memoryData = null;

        function getStatusLabel(status) {
            const labels = {
                'active': '正常',
                'draft': '草稿',
                'archived': '已归档'
            };
            return labels[status] || status;
        }

        function getStatusClass(status) {
            return 'status-' + (status || 'active');
        }

        function getCountdown(targetTimeStr) {
            const target = new Date(targetTimeStr.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return null;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return { days, hours, minutes, seconds };
        }

        let countdownTimer = null;
        function startCountdown(timeStr) {
            function update() {
                const el = document.getElementById('countdown-display');
                if (!el) return;
                const cd = getCountdown(timeStr);
                if (!cd) {
                    el.innerHTML = '<div class="text-green-400 font-bold text-2xl">已解锁！刷新页面查看内容</div>';
                    if (countdownTimer) clearInterval(countdownTimer);
                    return;
                }
                el.innerHTML = `
                    <div class="flex items-center justify-center gap-3">
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.days}</div>
                            <div class="text-xs text-gray-500">天</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.hours}</div>
                            <div class="text-xs text-gray-500">时</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.minutes}</div>
                            <div class="text-xs text-gray-500">分</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.seconds}</div>
                            <div class="text-xs text-gray-500">秒</div>
                        </div>
                    </div>
                `;
            }
            update();
            countdownTimer = setInterval(update, 1000);
        }

        function getVisibilityLabel(visibility) {
            return visibility === 'public' ? '公开' : '私有';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            content.className = 'glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3';
            if (type === 'success') {
                content.classList.add('border-green-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>${message}</span>
                `;
            } else {
                content.classList.add('border-red-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>${message}</span>
                `;
            }
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function deleteMemory() {
            showDeleteModal();
        }

        async function confirmDelete() {
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = true;
            btn.textContent = '删除中...';

            try {
                const res = await fetch(`/api/memories/${memoryId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('删除成功');
                    closeDeleteModal();
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showToast('删除失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认删除';
                }
            } catch (err) {
                console.error(err);
                showToast('删除出错', 'error');
                btn.disabled = false;
                btn.textContent = '确认删除';
            }
        }

        async function loadMemory() {
            const container = document.getElementById('memory-container');

            try {
                const res = await fetch(`/api/memories/${memoryId}`);

                if (res.status === 401) {
                    const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `/login.html?redirect=${currentUrl}`;
                    return;
                }

                if (res.status === 403) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">无权访问此记忆</div>';
                    return;
                }

                if (res.status === 404) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">记忆不存在或已被删除</div>';
                    return;
                }

                if (!res.ok) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">加载失败，请稍后重试</div>';
                    return;
                }

                const m = await res.json();
                memoryData = m;

                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }

                if (m.is_locked) {
                    document.getElementById('action-buttons').classList.add('hidden');
                    document.getElementById('qr-section').classList.add('hidden');

                    container.innerHTML = `
                        <div class="p-8 md:p-16 text-center">
                            <div class="w-28 h-28 mx-auto bg-cyber-neon/20 rounded-full flex items-center justify-center mb-8 border border-cyber-neon/30">
                                <svg class="w-14 h-14 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                </svg>
                            </div>

                            <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-4">${m.title}</h1>

                            <div class="flex items-center justify-center gap-3 mb-6 text-sm">
                                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                                    🔒 时光胶囊已锁定
                                </span>
                                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium ${m.visibility === 'public' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-gray-500/20 text-gray-400 border border-gray-500/30'}">
                                    ${getVisibilityLabel(m.visibility)}
                                </span>
                            </div>

                            <p class="text-gray-400 mb-8 max-w-md mx-auto">
                                这颗胶囊被时间封印着。在 ${m.unlock_time ? m.unlock_time.slice(0, 16).replace('T', ' ') : ''} 之前，
                                任何人（包括创建者）都无法查看其中的内容。
                            </p>

                            <div class="mb-4 text-sm text-gray-500">距离解锁还有</div>
                            <div id="countdown-display"></div>

                            <div class="mt-12 text-xs text-gray-600">
                                <p>By ${m.author} · 创建于 ${m.created_at}</p>
                            </div>
                        </div>
                    `;

                    if (m.unlock_time) {
                        startCountdown(m.unlock_time);
                    }
                    return;
                }

                if (!m.can_view) {
                    document.getElementById('action-buttons').classList.add('hidden');
                    document.getElementById('qr-section').classList.add('hidden');
                    container.innerHTML = `
                        <div class="p-12 text-center">
                            <svg class="w-16 h-16 mx-auto text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <h2 class="text-xl font-bold mb-2">私有记忆</h2>
                            <p class="text-gray-500 mb-6">这是一个私有时光胶囊，仅创建者可以查看。</p>
                            <a href="/login.html" class="text-cyber-light hover:underline">登录后查看 &rarr;</a>
                        </div>
                    `;
                    return;
                }

                document.getElementById('edit-btn').href = `/edit_memory.html?id=${m.id}`;
                document.getElementById('design-qr-btn').href = `/design.html?id=${m.id}`;
                document.getElementById('action-buttons').classList.remove('hidden');
                document.getElementById('action-buttons').classList.add('flex');

                let mediaHtml = '';
                if (m.media_url) {
                    if (m.media_type === 'image') {
                        mediaHtml = `<div class="mb-8 rounded-xl overflow-hidden shadow-lg"><img src="${m.media_url}" alt="Memory Media" class="w-full h-auto"></div>`;
                    } else if (m.media_type === 'video') {
                        mediaHtml = `<div class="mb-8 rounded-xl overflow-hidden shadow-lg"><video controls class="w-full"><source src="${m.media_url}">Your browser does not support the video tag.</video></div>`;
                    }
                }

                const updatedAtHtml = m.updated_at && m.updated_at !== m.created_at
                    ? `<span class="w-1 h-1 bg-gray-600 rounded-full"></span><span>更新于 ${m.updated_at}</span>`
                    : '';

                const visibilityBadge = m.visibility
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${m.visibility === 'public' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-gray-500/20 text-gray-400 border border-gray-500/30'}">
                        ${getVisibilityLabel(m.visibility)}
                    </span>`
                    : '';

                const unlockBadge = m.unlock_time
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-green-500/20 text-green-400 border border-green-500/30">
                        🔓 已解锁
                    </span>`
                    : '';

                container.innerHTML = `
                    <div class="p-8 md:p-12">
                        <div class="flex items-start justify-between gap-4 mb-6 flex-wrap">
                            <h1 class="text-4xl md:text-5xl font-bold gradient-text">${m.title}</h1>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="status-badge ${getStatusClass(m.status)}">
                                    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                                    ${getStatusLabel(m.status)}
                                </span>
                                ${visibilityBadge}
                                ${unlockBadge}
                            </div>
                        </div>

                        <div class="text-sm text-gray-500 mb-8 flex items-center gap-4 flex-wrap">
                            <span>创建于 ${m.created_at}</span>
                            ${updatedAtHtml}
                            <span class="w-1 h-1 bg-gray-600 rounded-full"></span>
                            <span>By ${m.author}</span>
                            ${m.unlock_time ? `<span class="w-1 h-1 bg-gray-600 rounded-full"></span><span>解锁于 ${m.unlock_time.slice(0, 16).replace('T', ' ')}</span>` : ''}
                        </div>

                        ${mediaHtml}

                        ${m.text_content ? `<div class="prose prose-invert prose-lg max-w-none text-gray-300 leading-relaxed whitespace-pre-wrap">${m.text_content}</div>` : ''}
                    </div>

                    <div class="bg-gray-900/50 p-6 flex justify-between items-center">
                         <div class="text-xs text-gray-500 font-mono">ID: ${m.id}</div>
                         <a href="/design.html?id=${m.id}" class="text-cyber-light text-sm hover:underline">设计二维码 &rarr;</a>
                    </div>
                `;

                if (m.qr_url) {
                    document.getElementById('qr-image').src = m.qr_url;
                    document.getElementById('qr-section').classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="p-12 text-center text-red-500">加载失败，请检查网络连接</div>';
            }
        }

        if (memoryId) {
            loadMemory();
        } else {
            document.getElementById('memory-container').innerHTML = '<div class="p-12 text-center text-red-500">无效的记忆ID</div>';
        }
    </script>
</body>
</html>
