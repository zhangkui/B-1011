<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看记忆 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-draft { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-archived { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }
        .countdown-digit {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(244, 114, 182, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4" id="nav-links"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <div class="mb-8 flex items-center justify-between">
                <a href="/dashboard.html" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm">
                    &larr; 返回我的记忆
                </a>
                <div id="action-buttons" class="hidden flex items-center gap-3">
                    <button onclick="deleteMemory()" class="text-red-400 hover:text-red-300 text-sm flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-red-500/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        删除
                    </button>
                    <a id="edit-btn" href="#" class="bg-cyber-light text-cyber-dark px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-400 transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        编辑
                    </a>
                </div>
            </div>

            <div class="glass rounded-2xl overflow-hidden shadow-2xl border-t-4 border-cyber-neon" id="memory-container">
                <div class="p-12 text-center text-gray-500">加载中...</div>
            </div>

            <div id="qr-section" class="mt-8 glass rounded-2xl p-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">记忆二维码</h3>
                    <a id="design-qr-btn" href="#" class="text-cyber-light text-sm hover:underline">重新设计 &rarr;</a>
                </div>
                <div class="flex items-center justify-center">
                    <img id="qr-image" src="" alt="Memory QR Code" class="max-h-64 rounded-xl shadow-lg">
                </div>
            </div>

            <div id="collab-section" class="mt-8 hidden">
                <div class="glass rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold flex items-center gap-2">
                            <svg class="w-5 h-5 text-cyber-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            协作
                        </h3>
                        <a id="collab-manage-btn" href="#" class="text-cyber-light text-sm hover:underline">管理协作 &rarr;</a>
                    </div>
                    <div id="collab-members" class="flex flex-wrap gap-2 mb-4"></div>
                    <div id="collab-recent-activity" class="border-t border-gray-700/50 pt-4">
                        <h4 class="text-sm font-medium text-gray-400 mb-3">最近动态</h4>
                        <div id="collab-logs-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <div id="comments-section" class="mt-8 hidden">
                <div class="glass rounded-2xl p-6">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        留言板
                    </h3>
                    <div id="comments-list" class="space-y-3 mb-4 max-h-64 overflow-y-auto"></div>
                    <div id="comment-form" class="hidden">
                        <div class="flex gap-2">
                            <input id="comment-input" type="text" maxlength="500" placeholder="写下你的留言..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white text-sm focus:outline-none focus:border-cyber-light">
                            <button onclick="submitComment()" class="bg-cyber-neon text-black px-4 py-2 rounded-lg text-sm font-bold hover:bg-pink-400 transition">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="glass p-6 rounded-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="deleteModalContent">
            <h3 class="text-xl font-bold mb-4">确认删除</h3>
            <p class="text-gray-300 mb-6">确定要删除这个记忆吗？此操作无法撤销，相关的媒体文件和二维码也会被一并删除。</p>
            <div class="flex justify-end gap-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-colors text-sm">取消</button>
                <button onclick="confirmDelete()" id="confirmDeleteBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition-colors text-sm font-bold">确认删除</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 right-4 transform translate-x-full transition-transform duration-300 z-50">
        <div id="toastContent" class="glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3">
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const memoryId = urlParams.get('id');
        let memoryData = null;

        function getStatusLabel(status) {
            const labels = {
                'active': '正常',
                'draft': '草稿',
                'archived': '已归档'
            };
            return labels[status] || status;
        }

        function getStatusClass(status) {
            return 'status-' + (status || 'active');
        }

        function getCountdown(targetTimeStr) {
            const target = new Date(targetTimeStr.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return null;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return { days, hours, minutes, seconds };
        }

        let countdownTimer = null;
        function startCountdown(timeStr) {
            function update() {
                const el = document.getElementById('countdown-display');
                if (!el) return;
                const cd = getCountdown(timeStr);
                if (!cd) {
                    el.innerHTML = '<div class="text-green-400 font-bold text-2xl">已解锁！刷新页面查看内容</div>';
                    if (countdownTimer) clearInterval(countdownTimer);
                    return;
                }
                el.innerHTML = `
                    <div class="flex items-center justify-center gap-3">
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.days}</div>
                            <div class="text-xs text-gray-500">天</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-light">${cd.hours}</div>
                            <div class="text-xs text-gray-500">时</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.minutes}</div>
                            <div class="text-xs text-gray-500">分</div>
                        </div>
                        <div class="countdown-digit">
                            <div class="text-3xl font-bold text-cyber-neon">${cd.seconds}</div>
                            <div class="text-xs text-gray-500">秒</div>
                        </div>
                    </div>
                `;
            }
            update();
            countdownTimer = setInterval(update, 1000);
        }

        function getVisibilityLabel(visibility) {
            return visibility === 'public' ? '公开' : '私有';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            content.className = 'glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3';
            if (type === 'success') {
                content.classList.add('border-green-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>${message}</span>
                `;
            } else {
                content.classList.add('border-red-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>${message}</span>
                `;
            }
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function deleteMemory() {
            showDeleteModal();
        }

        async function confirmDelete() {
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = true;
            btn.textContent = '删除中...';

            try {
                const res = await fetch(`/api/memories/${memoryId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('删除成功');
                    closeDeleteModal();
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showToast('删除失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认删除';
                }
            } catch (err) {
                console.error(err);
                showToast('删除出错', 'error');
                btn.disabled = false;
                btn.textContent = '确认删除';
            }
        }

        const roleBadgeColors = {
            'owner': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
            'editor': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
            'viewer': 'bg-gray-500/20 text-gray-400 border-gray-500/30',
            'commenter': 'bg-pink-500/20 text-pink-400 border-pink-500/30'
        };
        const roleLabels = {
            'owner': '创建者',
            'editor': '编辑者',
            'viewer': '查看者',
            'commenter': '留言者'
        };

        let myRole = null;
        let currentLat = null;
        let currentLon = null;
        let unlockSessionId = null;

        async function getCurrentPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('浏览器不支持地理定位'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        resolve({ lat: currentLat, lon: currentLon });
                    },
                    (err) => reject(err),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        function renderGeoLocked(m) {
            const container = document.getElementById('memory-container');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('qr-section').classList.add('hidden');

            container.innerHTML = `
                <div class="p-8 md:p-16 text-center">
                    <div class="w-28 h-28 mx-auto bg-cyber-light/20 rounded-full flex items-center justify-center mb-8 border border-cyber-light/30">
                        <svg class="w-14 h-14 text-cyber-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>

                    <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-4">${m.title}</h1>

                    <div class="flex items-center justify-center gap-3 mb-6 text-sm flex-wrap">
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-light/20 text-cyber-light border border-cyber-light/30">
                            📍 地理位置锁定
                        </span>
                        ${m.unlock_time ? `
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                            🔒 时光胶囊已锁定
                        </span>
                        ` : ''}
                    </div>

                    <p class="text-gray-400 mb-6 max-w-md mx-auto">
                        此记忆设置了地理位置解锁。您需要前往 <span class="text-cyber-light font-medium">${m.geo_address || '指定地点'}</span> 附近 ${m.geo_radius} 米范围内才能查看内容。
                    </p>

                    ${m.geo_message ? `
                    <div class="mb-6 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                        <p class="text-yellow-400 text-sm">${m.geo_message}</p>
                    </div>
                    ` : ''}

                    <div class="mb-8">
                        <button id="check-location-btn" onclick="checkGeoUnlock()" class="bg-cyber-light text-cyber-dark px-8 py-3 rounded-lg font-bold hover:bg-blue-400 transition flex items-center gap-2 mx-auto">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            验证当前位置
                        </button>
                    </div>

                    <div id="geo-status" class="text-sm text-gray-500"></div>

                    <div class="mt-12 text-xs text-gray-600">
                        <p>By ${m.author} · 创建于 ${m.created_at}</p>
                    </div>
                </div>
            `;
        }

        function renderGroupLocked(m) {
            const container = document.getElementById('memory-container');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('qr-section').classList.add('hidden');

            const isInitiator = false;
            const hasSession = m.group_session_id != null;
            const needMore = m.group_unlock_count - m.group_current_count;

            container.innerHTML = `
                <div class="p-8 md:p-16 text-center">
                    <div class="w-28 h-28 mx-auto bg-cyber-neon/20 rounded-full flex items-center justify-center mb-8 border border-cyber-neon/30">
                        <svg class="w-14 h-14 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>

                    <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-4">${m.title}</h1>

                    <div class="flex items-center justify-center gap-3 mb-6 text-sm flex-wrap">
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                            👥 多人联合解锁
                        </span>
                        ${m.unlock_time ? `
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-neon/20 text-cyber-neon border border-cyber-neon/30">
                            🔒 时光胶囊已锁定
                        </span>
                        ` : ''}
                    </div>

                    <p class="text-gray-400 mb-6 max-w-md mx-auto">
                        此记忆设置了多人联合解锁。需要 <span class="text-cyber-neon font-medium">${m.group_unlock_count}</span> 人共同扫码参与后才能查看内容，所有参与者都可查看。
                    </p>

                    ${m.group_message ? `
                    <div class="mb-6 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                        <p class="text-yellow-400 text-sm">${m.group_message}</p>
                    </div>
                    ` : ''}

                    <div class="mb-8 max-w-sm mx-auto">
                        <div class="flex items-center justify-between mb-3 text-sm">
                            <span class="text-gray-400">当前参与进度</span>
                            <span class="text-cyber-neon font-bold">${m.group_current_count} / ${m.group_unlock_count} 人</span>
                        </div>
                        <div class="h-3 bg-gray-700 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-cyber-light to-cyber-neon transition-all duration-500" style="width: ${(m.group_current_count / m.group_unlock_count) * 100}%"></div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-6">
                        ${!hasSession ? `
                        <button id="start-unlock-btn" onclick="startGroupUnlock()" class="bg-cyber-neon text-black px-8 py-3 rounded-lg font-bold hover:bg-pink-400 transition flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            发起联合解锁
                        </button>
                        ` : `
                        <button id="join-unlock-btn" onclick="joinGroupUnlock()" class="bg-cyber-neon text-black px-8 py-3 rounded-lg font-bold hover:bg-pink-400 transition flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                            参与联合解锁
                        </button>
                        `}
                        <button onclick="loadMemory()" class="px-6 py-3 rounded-lg border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition text-sm">
                            刷新状态
                        </button>
                    </div>

                    ${hasSession ? `
                    <div id="share-section" class="hidden mb-6">
                        <p class="text-sm text-gray-400 mb-3">分享解锁链接给朋友，共同解锁：</p>
                        <div class="flex items-center gap-2 max-w-md mx-auto">
                            <input type="text" id="unlock-link" readonly class="flex-1 bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-sm text-gray-300" value="">

            btn.disabled = true;
            btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 获取位置中...';
            statusEl.textContent = '';

            try {
                await getCurrentPosition();
                
                const res = await fetch(`/api/memories/${memoryId}?lat=${currentLat}&lon=${currentLon}`);
                if (res.ok) {
                    const data = await res.json();
                    memoryData = data;
                    
                    if (data.geo_locked) {
                        statusEl.textContent = data.geo_message || '位置验证失败，请前往指定地点';
                        statusEl.className = 'text-sm text-yellow-400';
                    } else {
                        statusEl.textContent = '位置验证成功！';
                        statusEl.className = 'text-sm text-green-400';
                        setTimeout(() => loadMemory(), 500);
                        return;
                    }
                }
            } catch (err) {
                let message = '获取位置失败';
                if (err.code === err.PERMISSION_DENIED) {
                    message = '您拒绝了位置权限请求，请在浏览器设置中允许访问位置';
                } else if (err.code === err.POSITION_UNAVAILABLE) {
                    message = '位置信息不可用';
                } else if (err.code === err.TIMEOUT) {
                    message = '获取位置超时，请重试';
                }
                statusEl.textContent = message;
                statusEl.className = 'text-sm text-red-400';
            }

            btn.disabled = false;
            btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 重新验证位置';

        async function loadCollabInfo() {
            if (!memoryId) return;
            try {
                const roleRes = await fetch(`/api/collab/${memoryId}/my-role`);
                if (!roleRes.ok) return;
                const roleData = await roleRes.json();
                if (!roleData.role) return;
                myRole = roleData.role;

                document.getElementById('collab-section').classList.remove('hidden');
                document.getElementById('collab-manage-btn').href = `/collaborate.html?id=${memoryId}`;

                const membersRes = await fetch(`/api/collab/${memoryId}/members`);
                if (membersRes.ok) {
                    const membersData = await membersRes.json();
                    const membersDiv = document.getElementById('collab-members');
                    membersDiv.innerHTML = membersData.members.map(m => {
                        const colors = roleBadgeColors[m.role] || roleBadgeColors['viewer'];
                        const label = roleLabels[m.role] || m.role;
                        return `<div class="flex items-center gap-2 bg-gray-800/50 px-3 py-1.5 rounded-full">
                            <div class="w-6 h-6 rounded-full bg-cyber-light/20 flex items-center justify-center text-xs font-bold text-cyber-light">${(m.username || '?')[0].toUpperCase()}</div>
                            <span class="text-sm text-gray-300">${m.username}</span>
                            <span class="text-xs px-1.5 py-0.5 rounded-full border ${colors}">${label}</span>
                        </div>`;
                    }).join('');
                }

                const logsRes = await fetch(`/api/collab/${memoryId}/logs?per_page=5`);
                if (logsRes.ok) {
                    const logsData = await logsRes.json();
                    const logsDiv = document.getElementById('collab-logs-list');
                    if (logsData.logs.length === 0) {
                        logsDiv.innerHTML = '<p class="text-xs text-gray-600">暂无动态</p>';
                    } else {
                        logsDiv.innerHTML = logsData.logs.map(l => `
                            <div class="flex items-start gap-2 text-xs">
                                <span class="text-cyber-light font-medium shrink-0">${l.username}</span>
                                <span class="text-gray-500">${l.detail || l.action}</span>
                                <span class="text-gray-700 shrink-0 ml-auto">${l.created_at}</span>
                            </div>
                        `).join('');
                    }
                }

                const commentsRes = await fetch(`/api/collab/${memoryId}/comments`);
                if (commentsRes.ok) {
                    const commentsData = await commentsRes.json();
                    if (commentsData.comments.length > 0 || roleData.can_comment) {
                        document.getElementById('comments-section').classList.remove('hidden');
                        renderComments(commentsData.comments);
                        if (roleData.can_comment) {
                            document.getElementById('comment-form').classList.remove('hidden');
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to load collab info:', err);
            }
        }

            const list = document.getElementById('comments-list');
            if (comments.length === 0) {
                list.innerHTML = '<p class="text-sm text-gray-600">暂无留言</p>';
                return;
            }
            list.innerHTML = comments.map(c => `

                    <div class="w-8 h-8 rounded-full bg-cyber-neon/20 flex items-center justify-center text-xs font-bold text-cyber-neon shrink-0">${(c.username || '?')[0].toUpperCase()}</div>

                        </div>

                </div>

        async function submitComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`/api/collab/${memoryId}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    const commentsRes = await fetch(`/api/collab/${memoryId}/comments`);
                    if (commentsRes.ok) {
                        const commentsData = await commentsRes.json();
                        renderComments(commentsData.comments);
                    }
                } else {
                    showToast(data.message || '留言失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function loadMemory() {
            const container = document.getElementById('memory-container');

            try {
                let url = `/api/memories/${memoryId}`;
                if (currentLat && currentLon) {
                    url += `?lat=${currentLat}&lon=${currentLon}`;
                }
                const res = await fetch(url);

                if (res.status === 401) {
                    const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `/login.html?redirect=${currentUrl}`;
                    return;
                }

                if (res.status === 403) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">无权访问此记忆</div>';
                    return;
                }

                if (res.status === 404) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">记忆不存在或已被删除</div>';
                    return;
                }

                if (!res.ok) {
                    container.innerHTML = '<div class="p-12 text-center text-red-500">加载失败，请稍后重试</div>';
                    return;
                }

                const m = await res.json();
                memoryData = m;

                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }

                if (m.is_locked) {
                    if (m.time_locked !== false) {
                        document.getElementById('action-buttons').classList.add('hidden');
                        document.getElementById('qr-section').classList.add('hidden');

                        container.innerHTML = `
                            <div class="p-8 md:p-16 text-center">
                                <div class="w-28 h-28 mx-auto bg-cyber-neon/20 rounded-full flex items-center justify-center mb-8 border border-cyber-neon/30">
                                    <svg class="w-14 h-14 text-cyber-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>

                                        🔒 时光胶囊已锁定
                                    </span>
                                    ${m.geo_locked ? `
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-cyber-light/20 text-cyber-light border border-cyber-light/30">
                                        📍 地理位置锁定

                                        👥 多人联合锁定
                                    </span>
                                    ` : ''}
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium ${m.visibility === 'public' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-gray-500/20 text-gray-400 border border-gray-500/30'}">
                                        ${getVisibilityLabel(m.visibility)}
                                    </span>
                                </div>

                                <p class="text-gray-400 mb-8 max-w-md mx-auto">
                                    这颗胶囊被时间封印着。在 ${m.unlock_time ? m.unlock_time.slice(0, 16).replace('T', ' ') : ''} 之前，
                                    任何人（包括创建者）都无法查看其中的内容。

                loadCollabInfo();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="p-12 text-center text-red-500">加载失败，请检查网络连接</div>';
            }
        }

        if (memoryId) {
            loadMemory();
        } else {
            document.getElementById('memory-container').innerHTML = '<div class="p-12 text-center text-red-500">无效的记忆ID</div>';
        }
    </script>
</body>
</html>
