<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的记忆 - Memory QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            light: '#38bdf8',
                            neon: '#f472b6',
                            card: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold tracking-wider gradient-text">MEMORY QR</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4" id="nav-links">
                        <!-- Loaded by JS -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-12">
            <h2 class="text-3xl font-bold">我的记忆</h2>
            <a href="/create.html" class="bg-cyber-light text-cyber-dark px-6 py-2 rounded-full font-bold hover:bg-blue-400 flex items-center gap-2">
                <span>+</span> 新建记忆
            </a>
        </div>

        <div class="flex gap-2 mb-8 flex-wrap">
            <button onclick="filterByStatus('')" class="status-filter px-4 py-2 rounded-full text-sm font-medium bg-cyber-light text-cyber-dark" data-status="">全部</button>
            <button onclick="filterByStatus('active')" class="status-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-status="active">正常</button>
            <button onclick="filterByStatus('draft')" class="status-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-status="draft">草稿</button>
            <button onclick="filterByStatus('archived')" class="status-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700" data-status="archived">已归档</button>
        </div>

        <div id="memories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500">加载中...</p>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="glass p-6 rounded-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="deleteModalContent">
            <h3 class="text-xl font-bold mb-4">确认删除</h3>
            <p class="text-gray-300 mb-6">确定要删除这个记忆吗？此操作无法撤销。</p>
            <div class="flex justify-end gap-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-colors text-sm">取消</button>
                <button id="confirmDeleteBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition-colors text-sm font-bold">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 right-4 transform translate-x-full transition-transform duration-300 z-50">
        <div id="toastContent" class="glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3">
            <!-- Icon and Text injected via JS -->
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        let currentFilter = '';

        function getStatusBadge(status) {
            const labels = {
                'active': '正常',
                'draft': '草稿',
                'archived': '已归档'
            };
            const colors = {
                'active': 'bg-green-500/20 text-green-400 border-green-500/30',
                'draft': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                'archived': 'bg-gray-500/20 text-gray-400 border-gray-500/30'
            };
            const label = labels[status] || status;
            const color = colors[status] || colors['active'];
            return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border ${color}">${label}</span>`;
        }

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.status-filter').forEach(btn => {
                if (btn.dataset.status === status) {
                    btn.className = 'status-filter px-4 py-2 rounded-full text-sm font-medium bg-cyber-light text-cyber-dark';
                } else {
                    btn.className = 'status-filter px-4 py-2 rounded-full text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700';
                }
            });
            loadMemories();
        }

        async function loadMemories() {
            try {
                const url = currentFilter ? `/api/memories?status=${currentFilter}` : '/api/memories';
                const res = await fetch(url);
                if (res.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const memories = await res.json();
                const grid = document.getElementById('memories-grid');
                grid.innerHTML = '';

                if (memories.length === 0) {
                    const emptyText = currentFilter ? `没有${currentFilter === 'draft' ? '草稿' : currentFilter === 'archived' ? '已归档' : ''}状态的记忆` : '你还没有创建任何记忆。';
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-20 text-gray-500">
                            <p class="text-xl mb-4">${emptyText}</p>
                            ${!currentFilter ? '<a href="/create.html" class="text-cyber-light hover:underline">创建你的第一个记忆</a>' : ''}
                        </div>
                    `;
                    return;
                }

                memories.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'glass rounded-xl overflow-hidden hover:border-cyber-light transition group';
                    card.innerHTML = `
                        <div class="aspect-square bg-gray-800 flex items-center justify-center p-4 relative">
                            ${m.qr_url
                                ? `<img src="${m.qr_url}" alt="QR Code" class="max-h-full max-w-full rounded-lg shadow-lg group-hover:scale-105 transition duration-500">`
                                : '<span class="text-gray-600">未生成二维码</span>'
                            }
                            ${m.status !== 'active' ? `<div class="absolute top-3 right-3">${getStatusBadge(m.status)}</div>` : ''}
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center gap-4">
                                <a href="/view_memory.html?id=${m.id}" class="bg-white text-black p-3 rounded-full hover:bg-gray-200" title="查看">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                </a>
                                <a href="/edit_memory.html?id=${m.id}" class="bg-cyber-neon text-black p-3 rounded-full hover:bg-pink-400" title="编辑">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </a>
                                <a href="/design.html?id=${m.id}" class="bg-cyber-light text-black p-3 rounded-full hover:bg-blue-400" title="设计二维码">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                                </a>
                                <button onclick="deleteMemory('${m.id}')" class="bg-red-500 text-white p-3 rounded-full hover:bg-red-600" title="删除">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-lg font-bold mb-1 truncate">${m.title}</h3>
                            <p class="text-xs text-gray-500">${m.created_at}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }
        let memoryToDelete = null;

        function showDeleteModal(id) {
            memoryToDelete = id;
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                memoryToDelete = null;
            }, 300);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            
            // Reset classes
            content.className = 'glass px-6 py-3 rounded-lg shadow-lg border-l-4 flex items-center gap-3';
            
            if (type === 'success') {
                content.classList.add('border-green-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>${message}</span>
                `;
            } else {
                content.classList.add('border-red-500');
                content.innerHTML = `
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>${message}</span>
                `;
            }
            
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!memoryToDelete) return;
            
            const id = memoryToDelete;
            closeDeleteModal(); // Close immediately for better UX
            
            try {
                const res = await fetch(`/api/memories/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('删除成功', 'success');
                    loadMemories();
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('删除出错', 'error');
            }
        });

        // Wrapper to keep the onclick interface compatible if needed, 
        // though we will update the HTML to call showDeleteModal directly
        function deleteMemory(id) {
            showDeleteModal(id);
        }

        loadMemories();
    </script>
</body>
</html>
